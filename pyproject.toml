[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "script-to-explainer"
version = "0.1.0"
description = "Turn a JSON script into a narrated 1080p explainer video, rendered locally."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pillow", "numpy", "soundfile", "kokoro-onnx"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
explainer = ["assets/bit/*", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
